name: Publish verified release assets
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v0.2.1
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify disks and assemble assets
        run: python tools/package_release.py
      - name: Publish release without replacing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version=$(cat VERSION)
          test "$RELEASE_TAG" = "v$version"
          gh release create "$RELEASE_TAG" release/* --verify-tag --title "$RELEASE_TAG Duas fases e menos cintilacao" --notes-file "docs/release-notes-$RELEASE_TAG.md"
